server.port=8080

spring.datasource.url=jdbc:h2:mem:vulndb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=always

# VULN-12 | Stack trace exposto | CWE-209
# Retorna a exception completa na resposta HTTP, revelando caminhos
# internos, versoes de biblioteca e estrutura do codigo.
# Correcao: desabilitar em producao e usar handler de erro generico.
server.error.include-stacktrace=always
server.error.include-message=always
