name: AppSec Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:

  # ─────────────────────────────────────────────────────────────
  # SAST — analise estatica do codigo-fonte
  # ─────────────────────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Rodar Semgrep
        run: |
          semgrep scan \
            --config=p/java \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --sarif --output=semgrep.sarif \
            --metrics=off || true

      - name: Resumo legivel
        run: |
          semgrep scan \
            --config=p/java \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --metrics=off || true

      - name: Publicar SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

      - name: Guardar relatorio
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-semgrep
          path: semgrep.sarif

  # ─────────────────────────────────────────────────────────────
  # SCA — dependencias de terceiros
  # ─────────────────────────────────────────────────────────────
  sca:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy - resumo legivel
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./app
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: Trivy - gerar SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./app
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: Conferir arquivo gerado
        run: ls -la trivy.sarif || echo "SARIF nao foi gerado"

      - name: Publicar SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-sca

      - name: Guardar relatorio
        uses: actions/upload-artifact@v4
        if: hashFiles('trivy.sarif') != ''
        with:
          name: sca-trivy
          path: trivy.sarif

  # ─────────────────────────────────────────────────────────────
  # DAST — aplicacao rodando
  # ─────────────────────────────────────────────────────────────
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [ sast ]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build da aplicacao
        working-directory: ./app
        run: mvn -B -q clean package -DskipTests

      - name: Subir aplicacao
        working-directory: ./app
        run: |
          nohup java -jar target/vulnapi-1.0.0.jar > app.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/users/all > /dev/null 2>&1; then
              echo "Aplicacao no ar."
              exit 0
            fi
            sleep 2
          done
          echo "Aplicacao nao subiu. Log:"
          cat app.log
          exit 1

      # Confere se a raiz responde antes do scan.
      # Na primeira execucao o spider do ZAP parou em 404 na raiz e nao
      # alcancou nenhum endpoint — ver TRIAGE.md, secao DAST.
      - name: Conferir se a raiz responde
        run: |
          echo "--- HTTP status ---"
          curl -s -o /dev/null -w "GET /                -> %{http_code}\n" http://localhost:8080/
          curl -s -o /dev/null -w "GET /api/users/all   -> %{http_code}\n" http://localhost:8080/api/users/all

      - name: ZAP Baseline Scan
        run: |
          mkdir -p zap-report && chmod 777 zap-report
          docker run --rm --network host \
            -v "$(pwd)/zap-report:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 \
            -r zap-report.html -J zap-report.json \
            -a -j -m 3 -T 5 || true
          echo "--- Relatorios gerados ---"
          ls -la zap-report/

      - name: Guardar relatorio do ZAP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-zap
          path: zap-report/
